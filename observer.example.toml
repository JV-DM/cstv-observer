# Copy to observer.toml and run:  python -m observer run --config observer.toml

[observer]
listen_host = "127.0.0.1"      # where CS2 posts GSI (same PC as the CSTV client)
listen_port = 3500
gsi_token   = "cstv-observer"  # must match the token in gamestate_integration_cstv_observer.cfg
manual_override_seconds = 8.0  # if you change the camera by hand, the director backs off this long
tick_hz = 10
# weights_file = "weights.json"  # produced by `python -m observer tune`

[netcon]
netcon_host = "127.0.0.1"
netcon_port = 2121             # CS2 launch option:  -netconport 2121
# How a cut is sent. {accountid} {steamid} {slot} {name} are filled in.
command_template  = "spec_player_by_accountid {accountid}"
fallback_template = 'spec_player "{name}"'   # used automatically if the first one stops working
init_commands = ["spec_autodirector 0"]

[lookahead]
# Needs the CstvObserverFeed plugin on the game server (see plugin/). Without it leave this false.
lookahead  = false
feed_token = "change-me"       # must match "Token" in the plugin config
# set [observer].listen_host = "0.0.0.0" so the game server can reach /feed (firewall: allow only the server IP)

[lookahead.plan]
lead_ideal   = 2.5   # seconds on the player before a kill
lead_min     = 0.8
tail         = 0.9   # seconds after the kill
min_shot     = 1.3
victim_value = 0.75  # how much a kill seen from the victim's eyes is worth (killer = 1.0)

[weights]
# Any field of observer/scoring.py:Weights can be overridden here, e.g.
# min_dwell = 2.3
# mutual = 1.76
