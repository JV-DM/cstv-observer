name: Build Windows app

# Runs only when a release is requested (a tag like v0.2.0 is pushed) or when started by hand
# from the Actions tab. Normal code pushes do not build, to save GitHub Actions minutes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest

      - name: Run tests on Windows
        run: python -m pytest -q tests

      - name: Build CSTV-Observer.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name CSTV-Observer --icon assets/icon.ico
          --exclude-module demoparser2 --exclude-module pandas --exclude-module numpy --exclude-module pytest
          launcher.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CSTV-Observer.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Start the exe and check the control page answers
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CSTV-Observer.exe" -ArgumentList "--dry-run","--no-browser" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $s = Invoke-RestMethod http://127.0.0.1:3500/api/setup; $ok = $true } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "app did not start" }
          $s | ConvertTo-Json -Depth 3
          $page = Invoke-WebRequest http://127.0.0.1:3500/ -UseBasicParsing
          if ($page.Content -notmatch "CSTV Observer") { throw "control page missing" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/action -ContentType "application/json" -Body '{"action":"quit"}'
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; throw "app did not quit" }

      - name: Keep the build for 7 days (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CSTV-Observer
          path: dist/CSTV-Observer.exe
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "dist/CSTV-Observer.exe" --title "CSTV Observer ${{ github.ref_name }}" --notes-file .github/release-notes.md
